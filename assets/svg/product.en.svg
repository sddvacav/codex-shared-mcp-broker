<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Product overview</title>
  <desc id="desc">A clean product card showing the main configuration and verification surfaces.</desc>
  <rect width="1280" height="720" fill="#0f172a"/>
  <rect x="80" y="80" width="1120" height="560" rx="28" fill="#f8fafc"/>
  <text x="128" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Codex Shared MCP Broker</text>
  <text x="128" y="188" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">A reproducible setup for high-effort Codex Desktop workloads.</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="128" y="250" width="300" height="230" rx="18" fill="#e0f2fe"/>
    <text x="160" y="300" font-size="22" font-weight="700" fill="#075985">Policy</text>
    <text x="160" y="340" font-size="17" fill="#0f172a">xhigh reasoning</text>
    <text x="160" y="374" font-size="17" fill="#0f172a">400K context target</text>
    <text x="160" y="408" font-size="17" fill="#0f172a">360K compaction trigger</text>

    <rect x="490" y="250" width="300" height="230" rx="18" fill="#dcfce7"/>
    <text x="522" y="300" font-size="22" font-weight="700" fill="#14532d">Broker</text>
    <text x="522" y="340" font-size="17" fill="#0f172a">127.0.0.1:38808</text>
    <text x="522" y="374" font-size="17" fill="#0f172a">HTTP MCP endpoints</text>
    <text x="522" y="408" font-size="17" fill="#0f172a">single process owner</text>

    <rect x="852" y="250" width="300" height="230" rx="18" fill="#fff7ed"/>
    <text x="884" y="300" font-size="22" font-weight="700" fill="#9a3412">Verification</text>
    <text x="884" y="340" font-size="17" fill="#0f172a">config audit</text>
    <text x="884" y="374" font-size="17" fill="#0f172a">MCP URL check</text>
    <text x="884" y="408" font-size="17" fill="#0f172a">secret scan</text>
  </g>
  <rect x="128" y="535" width="1024" height="54" rx="14" fill="#111827"/>
  <text x="158" y="570" font-family="Consolas, monospace" font-size="18" fill="#bbf7d0">codex-shared-mcp-audit .  ->  audit-ok</text>
</svg>
