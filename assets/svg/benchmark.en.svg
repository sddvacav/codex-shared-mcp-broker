<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic MCP fan-out benchmark</title>
  <desc id="desc">Before and after comparison for direct stdio MCP process fan-out versus a shared local HTTP broker.</desc>
  <rect width="1200" height="680" fill="#f7f9fc"/>
  <text x="70" y="70" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" fill="#0f172a">Synthetic MCP Fan-Out Benchmark</text>
  <text x="70" y="108" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">10 Codex windows × 8 MCP servers per window, privacy-safe synthetic model</text>

  <rect x="70" y="150" width="500" height="390" rx="12" fill="#ffffff" stroke="#d8dee9"/>
  <text x="110" y="205" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#991b1b">Before: direct stdio</text>
  <text x="110" y="238" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#475569">Each window can own its own backend tree</text>
  <rect x="110" y="280" width="380" height="42" rx="8" fill="#fee2e2"/>
  <rect x="110" y="336" width="380" height="42" rx="8" fill="#fecaca"/>
  <rect x="110" y="392" width="380" height="42" rx="8" fill="#fca5a5"/>
  <rect x="110" y="448" width="380" height="42" rx="8" fill="#f87171"/>
  <text x="130" y="307" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#7f1d1d">80 backend process units</text>
  <text x="130" y="363" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#7f1d1d">80 process trees</text>
  <text x="130" y="419" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#7f1d1d">duplicated per window</text>
  <text x="130" y="475" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#7f1d1d">local runtime fan-out</text>

  <rect x="630" y="150" width="500" height="390" rx="12" fill="#ffffff" stroke="#d8dee9"/>
  <text x="670" y="205" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#14532d">After: shared broker</text>
  <text x="670" y="238" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#475569">Codex windows connect through local HTTP endpoints</text>
  <rect x="670" y="280" width="90" height="42" rx="8" fill="#bbf7d0"/>
  <rect x="670" y="336" width="90" height="42" rx="8" fill="#86efac"/>
  <rect x="670" y="392" width="150" height="42" rx="8" fill="#4ade80"/>
  <rect x="670" y="448" width="240" height="42" rx="8" fill="#22c55e"/>
  <text x="780" y="307" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#14532d">8 backend process units</text>
  <text x="780" y="363" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#14532d">1 broker process unit</text>
  <text x="840" y="419" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#14532d">one backend pool</text>
  <text x="930" y="475" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#14532d">9 total units</text>

  <rect x="270" y="575" width="660" height="58" rx="12" fill="#0f172a"/>
  <text x="315" y="612" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Synthetic reduction: 71 process units, 88.75%</text>
</svg>
