<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">产品图</title>
  <desc id="desc">展示配置策略、broker 和验证面的产品卡片。</desc>
  <rect width="1280" height="720" fill="#0f172a"/>
  <rect x="80" y="80" width="1120" height="560" rx="28" fill="#f8fafc"/>
  <text x="128" y="150" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Codex 共享 MCP Broker</text>
  <text x="128" y="188" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">面向高强度 Codex Desktop 科研工作流的可复现配置方案。</text>
  <g font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif">
    <rect x="128" y="250" width="300" height="230" rx="18" fill="#e0f2fe"/>
    <text x="160" y="300" font-size="22" font-weight="700" fill="#075985">策略</text>
    <text x="160" y="340" font-size="17" fill="#0f172a">xhigh 推理强度</text>
    <text x="160" y="374" font-size="17" fill="#0f172a">400K 上下文目标</text>
    <text x="160" y="408" font-size="17" fill="#0f172a">360K 自动压缩阈值</text>

    <rect x="490" y="250" width="300" height="230" rx="18" fill="#dcfce7"/>
    <text x="522" y="300" font-size="22" font-weight="700" fill="#14532d">Broker</text>
    <text x="522" y="340" font-size="17" fill="#0f172a">127.0.0.1:38808</text>
    <text x="522" y="374" font-size="17" fill="#0f172a">HTTP MCP 端点</text>
    <text x="522" y="408" font-size="17" fill="#0f172a">单一进程归属</text>

    <rect x="852" y="250" width="300" height="230" rx="18" fill="#fff7ed"/>
    <text x="884" y="300" font-size="22" font-weight="700" fill="#9a3412">验证</text>
    <text x="884" y="340" font-size="17" fill="#0f172a">配置审计</text>
    <text x="884" y="374" font-size="17" fill="#0f172a">MCP URL 检查</text>
    <text x="884" y="408" font-size="17" fill="#0f172a">密钥扫描</text>
  </g>
  <rect x="128" y="535" width="1024" height="54" rx="14" fill="#111827"/>
  <text x="158" y="570" font-family="Consolas, monospace" font-size="18" fill="#bbf7d0">codex-shared-mcp-audit .  ->  audit-ok</text>
</svg>
