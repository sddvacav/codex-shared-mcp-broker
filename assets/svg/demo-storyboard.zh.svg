<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">演示分镜</title>
  <desc id="desc">Codex Shared MCP Broker 的六步演示流程。</desc>
  <rect width="1200" height="520" fill="#f8fafc"/>
  <text x="60" y="62" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">60-90 秒演示流程</text>
  <text x="60" y="98" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="17" fill="#475569">问题 → 模式 → 诊断 → benchmark → 隐私 → 发布</text>
  <g font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif">
    <rect x="60" y="150" width="160" height="210" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="85" y="198" font-size="22" font-weight="700" fill="#991b1b">1 问题</text>
    <text x="85" y="238" font-size="15" fill="#475569">后开的窗口</text>
    <text x="85" y="262" font-size="15" fill="#475569">越来越慢</text>
    <rect x="248" y="150" width="160" height="210" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="273" y="198" font-size="22" font-weight="700" fill="#1d4ed8">2 模式</text>
    <text x="273" y="238" font-size="15" fill="#475569">共享本机</text>
    <text x="273" y="262" font-size="15" fill="#475569">HTTP MCP</text>
    <rect x="436" y="150" width="160" height="210" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="461" y="198" font-size="22" font-weight="700" fill="#0f766e">3 诊断</text>
    <text x="461" y="238" font-size="15" fill="#475569">配置和</text>
    <text x="461" y="262" font-size="15" fill="#475569">transport 报告</text>
    <rect x="624" y="150" width="160" height="210" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="649" y="198" font-size="22" font-weight="700" fill="#7c2d12">4 Benchmark</text>
    <text x="649" y="238" font-size="15" fill="#475569">80 单元到 9</text>
    <text x="649" y="262" font-size="15" fill="#475569">合成模型</text>
    <rect x="812" y="150" width="160" height="210" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="837" y="198" font-size="22" font-weight="700" fill="#166534">5 隐私</text>
    <text x="837" y="238" font-size="15" fill="#475569">发布前</text>
    <text x="837" y="262" font-size="15" fill="#475569">先扫描</text>
    <rect x="1000" y="150" width="160" height="210" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1025" y="198" font-size="22" font-weight="700" fill="#334155">6 发布</text>
    <text x="1025" y="238" font-size="15" fill="#475569">安全素材包</text>
  </g>
  <rect x="330" y="410" width="540" height="50" rx="10" fill="#0f172a"/>
  <text x="386" y="442" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">证据优先的发布流程，默认隐私安全</text>
</svg>
