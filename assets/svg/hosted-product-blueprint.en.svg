<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Hosted product blueprint</title>
  <desc id="desc">Static launch page to hosted material-intelligence platform architecture.</desc>
  <rect width="1400" height="820" fill="#f8fafc"/>
  <text x="70" y="70" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" fill="#0f172a">Hosted Product Blueprint</text>
  <text x="70" y="108" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">From GitHub awareness to paid material-intelligence execution</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="70" y="170" width="250" height="150" rx="14" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="100" y="220" font-size="24" font-weight="700" fill="#1e3a8a">GitHub Repo</text>
    <text x="100" y="255" font-size="16" fill="#1e40af">trust, source, releases</text>

    <rect x="390" y="170" width="250" height="150" rx="14" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="420" y="220" font-size="24" font-weight="700" fill="#075985">GitHub Pages</text>
    <text x="420" y="255" font-size="16" fill="#0369a1">landing, demo, SEO</text>

    <rect x="710" y="170" width="250" height="150" rx="14" fill="#dcfce7" stroke="#86efac"/>
    <text x="740" y="220" font-size="24" font-weight="700" fill="#14532d">SaaS Frontend</text>
    <text x="740" y="255" font-size="16" fill="#166534">authenticated workflows</text>

    <rect x="1030" y="170" width="250" height="150" rx="14" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="1060" y="220" font-size="24" font-weight="700" fill="#78350f">Backend API</text>
    <text x="1060" y="255" font-size="16" fill="#92400e">jobs, billing, auth</text>

    <rect x="190" y="440" width="250" height="150" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="220" y="490" font-size="24" font-weight="700" fill="#0f172a">Database</text>
    <text x="220" y="525" font-size="16" fill="#475569">users, projects, jobs</text>

    <rect x="510" y="440" width="250" height="150" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="540" y="490" font-size="24" font-weight="700" fill="#0f172a">Object Storage</text>
    <text x="540" y="525" font-size="16" fill="#475569">files and artifacts</text>

    <rect x="830" y="440" width="250" height="150" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="860" y="490" font-size="24" font-weight="700" fill="#0f172a">Worker Pool</text>
    <text x="860" y="525" font-size="16" fill="#475569">GPU/CPU execution</text>

    <rect x="1150" y="440" width="180" height="150" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1180" y="490" font-size="24" font-weight="700" fill="#0f172a">Region</text>
    <text x="1180" y="525" font-size="16" fill="#475569">routing rules</text>

    <path d="M320 245 H390" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M640 245 H710" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M960 245 H1030" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M1155 320 V405 H315 V440" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M1155 320 V405 H635 V440" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M1155 320 V405 H955 V440" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
    <path d="M1155 320 V440" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

    <rect x="250" y="680" width="900" height="58" rx="12" fill="#0f172a"/>
    <text x="305" y="717" font-size="22" font-weight="700" fill="#ffffff">Public repo creates demand. Hosted platform captures paid execution value.</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
