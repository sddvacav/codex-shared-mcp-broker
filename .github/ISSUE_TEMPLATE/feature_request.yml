name: Feature request
description: Suggest a new runtime diagnostic, broker pattern, or privacy check.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What local agent runtime problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the repository add?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - MCP broker
        - Codex Desktop
        - Runtime diagnostics
        - Privacy audit
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include tokens, private paths, account IDs, or local gateway details.
          required: true

