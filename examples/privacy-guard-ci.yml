name: Privacy Guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  privacy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Scan public artifacts
        run: agent-runtime-privacy-guard . --format markdown
