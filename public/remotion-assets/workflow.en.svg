<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Runtime workflow</title>
  <desc id="desc">Startup and verification flow for a shared MCP broker setup.</desc>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="64" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" fill="#111827">Runtime workflow</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g fill="#f1f5f9" stroke="#64748b" stroke-width="2">
      <rect x="90" y="170" width="180" height="96" rx="16"/>
      <rect x="320" y="170" width="180" height="96" rx="16"/>
      <rect x="550" y="170" width="180" height="96" rx="16"/>
      <rect x="780" y="170" width="180" height="96" rx="16"/>
      <rect x="1010" y="170" width="180" height="96" rx="16"/>
    </g>
    <text x="128" y="213" font-size="18" font-weight="700" fill="#0f172a">1. Preflight</text>
    <text x="119" y="241" font-size="14" fill="#475569">Check config and port</text>
    <text x="354" y="213" font-size="18" font-weight="700" fill="#0f172a">2. Broker</text>
    <text x="348" y="241" font-size="14" fill="#475569">Start single owner</text>
    <text x="584" y="213" font-size="18" font-weight="700" fill="#0f172a">3. Codex</text>
    <text x="582" y="241" font-size="14" fill="#475569">Use HTTP MCP URLs</text>
    <text x="812" y="213" font-size="18" font-weight="700" fill="#0f172a">4. Verify</text>
    <text x="806" y="241" font-size="14" fill="#475569">No orphan MCP tools</text>
    <text x="1044" y="213" font-size="18" font-weight="700" fill="#0f172a">5. Run</text>
    <text x="1036" y="241" font-size="14" fill="#475569">Parallel research tasks</text>
  </g>
  <g fill="none" stroke="#0ea5e9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M270 218 H318"/>
    <path d="M500 218 H548"/>
    <path d="M730 218 H778"/>
    <path d="M960 218 H1008"/>
    <path d="M303 200 L318 218 L303 236"/>
    <path d="M533 200 L548 218 L533 236"/>
    <path d="M763 200 L778 218 L763 236"/>
    <path d="M993 200 L1008 218 L993 236"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="128" y="380" width="1024" height="150" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="174" y="432" font-size="24" font-weight="700" fill="#164e63">Invariant</text>
    <text x="174" y="468" font-size="18" fill="#155e75">Codex windows never spawn their own heavy MCP stdio trees. They connect to stable local HTTP endpoints.</text>
    <text x="174" y="502" font-size="18" fill="#155e75">xhigh reasoning stays enabled; performance is recovered by reducing local process fan-out.</text>
  </g>
</svg>
