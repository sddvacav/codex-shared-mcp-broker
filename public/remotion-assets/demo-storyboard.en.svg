<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Demo storyboard</title>
  <desc id="desc">Six-step demo flow for Codex Shared MCP Broker.</desc>
  <rect width="1200" height="520" fill="#f8fafc"/>
  <text x="60" y="62" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">60-90s Demo Flow</text>
  <text x="60" y="98" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#475569">Problem → pattern → diagnose → benchmark → privacy → release</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="60" y="150" width="160" height="210" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="85" y="198" font-size="22" font-weight="700" fill="#991b1b">1 Problem</text>
    <text x="85" y="238" font-size="15" fill="#475569">Later windows</text>
    <text x="85" y="262" font-size="15" fill="#475569">get slower</text>
    <rect x="248" y="150" width="160" height="210" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="273" y="198" font-size="22" font-weight="700" fill="#1d4ed8">2 Pattern</text>
    <text x="273" y="238" font-size="15" fill="#475569">Shared local</text>
    <text x="273" y="262" font-size="15" fill="#475569">HTTP MCP</text>
    <rect x="436" y="150" width="160" height="210" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="461" y="198" font-size="22" font-weight="700" fill="#0f766e">3 Diagnose</text>
    <text x="461" y="238" font-size="15" fill="#475569">Config and</text>
    <text x="461" y="262" font-size="15" fill="#475569">transport report</text>
    <rect x="624" y="150" width="160" height="210" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="649" y="198" font-size="22" font-weight="700" fill="#7c2d12">4 Benchmark</text>
    <text x="649" y="238" font-size="15" fill="#475569">80 units to 9</text>
    <text x="649" y="262" font-size="15" fill="#475569">synthetic model</text>
    <rect x="812" y="150" width="160" height="210" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="837" y="198" font-size="22" font-weight="700" fill="#166534">5 Privacy</text>
    <text x="837" y="238" font-size="15" fill="#475569">Guard before</text>
    <text x="837" y="262" font-size="15" fill="#475569">publishing</text>
    <rect x="1000" y="150" width="160" height="210" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1025" y="198" font-size="22" font-weight="700" fill="#334155">6 Release</text>
    <text x="1025" y="238" font-size="15" fill="#475569">Safe asset</text>
    <text x="1025" y="262" font-size="15" fill="#475569">pack</text>
  </g>
  <rect x="330" y="410" width="540" height="50" rx="10" fill="#0f172a"/>
  <text x="383" y="442" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Evidence-first launch flow, privacy-safe by default</text>
</svg>
